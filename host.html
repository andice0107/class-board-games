<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌遊對戰教室・老師房間</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="platform.css?v=202611131519">
</head>
<body>
<header class="h-top">
  <a class="brand" href="index.html" style="text-decoration:none"><div class="logo"><i></i><i></i><i></i><i></i></div><h1>桌遊對戰教室<small>老師房間</small></h1></a>
  <span class="pill" id="h-count">0 位學生</span>
  <span class="sp"></span>
  <span class="pill" id="h-net">🟡 連線中…</span>
  <span id="h-sfx"></span>
  <button class="btn small ghost" id="h-lb" type="button">🏆 積分榜</button>
  <button class="btn small ghost" id="h-help" type="button">📖 教師說明</button>
  <button class="btn small ghost" id="h-new" type="button">🆕 開新房間</button>
</header>
<div class="h-wrap">
  <aside class="panel join">
    <div class="gname" id="h-game"></div>
    <div class="qr" id="h-qr">連線中…</div>
    <div class="code-hint">📷 掃 QR code 就能直接加入</div>
    <div class="code-hint">連線序號</div>
    <div class="code-wrap" id="h-code"></div>
    <div class="code-hint">不能掃碼的同學：把下面的網址傳給他，<br>或請他打開 play.html 輸入連線序號</div>
    <button type="button" class="url-copy" id="h-copy" title="點一下複製網址"><span class="url" id="h-url"></span><span class="url-btn" id="h-copy-t">📋 點一下複製網址</span></button>
    <div class="sec-title">⏳ 等候配對 <span class="pill" id="h-wn">0</span></div>
    <div class="chips" id="h-wait"></div>
    <label class="switch"><input type="checkbox" id="h-auto"> 自動配對開桌</label>
    <label class="switch" style="margin-top:6px"><input type="checkbox" id="h-bot"> 允許學生和電腦對戰</label>
    <label class="switch lock" style="margin-top:6px"><input type="checkbox" id="h-lock"> 🔒 鎖住房間（學生到齊後勾選，新的人就進不來）</label>
    <div class="row c" style="margin-top:10px"><button class="btn small" id="h-pairnow" type="button">🤝 立刻配對等候中的學生</button></div>
  </aside>
  <section>
    <div class="tables" id="h-tables"></div>
    <div class="notable" id="h-notable"><div class="big">🎲</div><br>學生掃描左邊的 QR code、輸入 4 碼學號後，<br>會先進入左邊的「等候配對」。<br>說明完規則後，點學生名字手動配對，或勾選「自動配對開桌」。<br>每一桌的狀況都會即時出現在這裡。</div>
  </section>
</div>
<div class="overlay hidden" id="h-ov"><div class="panel" id="h-ovbox"></div></div>
<div class="overlay hidden" id="h-lbov"><div class="panel" id="h-lbbox"></div></div>
<script src="decor.js?v=202611131519"></script>
<script src="vendor/mqtt.min.js?v=202611131519"></script>
<script src="vendor/qrcode.js?v=202611131519"></script>
<script src="net.js?v=202611131519"></script>
<script src="sfx.js?v=202611131519"></script>
<script src="games.js?v=202611131519"></script>
<script src="host.js?v=202611131519"></script>
</body>
</html>
